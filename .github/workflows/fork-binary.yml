# FORK-ONLY (tmiland-lab self-hosting edition): manual single-platform binary
# build for dogfood testing of fork branches. Never merge upstream.
name: fork-binary
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-bun
      - run: bun script/build.ts --single
        working-directory: packages/opencode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-opencode-linux-x64
          path: packages/opencode/dist/opencode-linux-x64/bin/opencode
          if-no-files-found: error
